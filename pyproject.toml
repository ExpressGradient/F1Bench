[project]
name = "f1-bench"
version = "0.10.0"
description = "A Formula 1 forecasting benchmark with persistent model research and scored predictions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["mini-swe-agent==2.4.6"]

[project.urls]
Homepage = "https://f1bench.vercel.app"
Repository = "https://github.com/ExpressGradient/F1Bench"
Issues = "https://github.com/ExpressGradient/F1Bench/issues"

[project.scripts]
f1bench = "f1bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1bench"]
